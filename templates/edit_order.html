<!DOCTYPE html>
<html>
<head><title>Edit Order</title></head>
<body>
    <h1>Edit Order for Round {{ order.round.number }}</h1>
    <form method="POST">
        <table border="1">
            <tr><th>Product</th><th>Price</th><th>Quantity</th></tr>
            {% for p in products %}
            <tr>
                <td>{{ p.name }} ({{ p.sale_type }})</td>
                <td>{{ p.price }}</td>
                <td>
                    <input type="number" step="0.01" name="qty_{{ p.id }}" 
                           value="{{ order_lines.get(p.id, '') }}">
                </td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit">Update Order</button>
    </form>
    <br>
    <a href="{{ url_for('my_orders') }}">Back to My Orders</a>
</body>
</html>
