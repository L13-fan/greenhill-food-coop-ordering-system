<!doctype html>
<html>
<head><title>{% if product %}Edit{% else %}New{% endif %} Product</title></head>
<body>
  <h1>{% if product %}Edit Product{% else %}Add Product{% endif %}</h1>
  {% if product %}
    <form method="post" action="{{ url_for('admin_product_edit', product_id=product.id) }}">
  {% else %}
    <form method="post" action="{{ url_for('admin_product_new') }}">
  {% endif %}
    <p>Name: <input type="text" name="name" value="{{ product.name if product else '' }}" required></p>
    <p>Sold by:
      <select name="sale_type">
        <option value="unit" {% if product and product.sale_type == 'unit' %}selected{% endif %}>Per item (each)</option>
        <option value="weight" {% if product and product.sale_type == 'weight' %}selected{% endif %}>Per kilogram (kg)</option>
      </select>
    </p>
    <p>Price: <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required></p>
    <p>Bay (optional): <input type="text" name="bay" value="{{ product.bay if product else '' }}"></p>
    <button type="submit">Save</button>
  </form>
  <p><a href="{{ url_for('admin_products') }}">Back to product list</a></p>
</body>
</html>
