<!doctype html>
<html>
<head><title>Product Management</title></head>
<body>
  <h1>Coordinator - Product Management</h1>
  <p><a href="{{ url_for('admin_product_new') }}">+ Add product</a></p>
  <table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Name</th><th>Sold by</th><th>Price</th><th>Bay</th><th>Status</th><th>Actions</th></tr>
    {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ 'per kg' if p.sale_type == 'weight' else 'each' }}</td>
      <td>${{ '%.2f'|format(p.price) }}</td>
      <td>{{ p.bay or '' }}</td>
      <td>{{ 'available' if p.active else 'withdrawn' }}</td>
      <td>
        <a href="{{ url_for('admin_product_edit', product_id=p.id) }}">Edit</a>
        <form method="post" action="{{ url_for('admin_product_toggle', product_id=p.id) }}" style="display:inline">
          <button type="submit">{{ 'Withdraw' if p.active else 'Restore' }}</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
  <p><a href="/">Home</a></p>
</body>
</html>
