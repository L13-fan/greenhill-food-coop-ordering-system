{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit Product' if product else 'New Product' }}</h2>
<form method="POST">
    <p>
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ product.name if product else '' }}" required>
    </p>
    <p>
        <label>Price:</label><br>
        <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required>
    </p>
    <p>
        <label>Selling Method:</label><br>
        <select name="sale_type">
            <option value="unit" {% if product and product.sale_type == 'unit' %}selected{% endif %}>Per Unit (e.g., jars, dozens)</option>
            <option value="weight" {% if product and product.sale_type == 'weight' %}selected{% endif %}>Per Kilogram (e.g., oats, rice)</option>
        </select>
    </p>
    <p>
        <label>Bay Location:</label><br>
        <input type="text" name="bay" value="{{ product.bay if product else '' }}">
    </p>
    <button type="submit" style="padding: 8px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px;">Save Product</button>
    <a href="{{ url_for('admin_products') }}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
