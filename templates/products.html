{% extends "base.html" %}
{% block content %}
<h2>Current Round Products</h2>
{% if not round %}
    <p>No round is currently open.</p>
{% else %}
<form method="post" action="{{ url_for('place_order') }}">
    <table>
        <tr><th>Product</th><th>Type</th><th>Price</th><th>Quantity</th></tr>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.sale_type }}</td>
            <td>${{ "%.2f"|format(p.price) }}</td>
            <td><input type="number" step="0.01" name="qty_{{ p.id }}" min="0"></td>
        </tr>
        {% endfor %}
    </table>
    <button type="submit">Place Order</button>
</form>
{% endif %}
{% endblock %}
